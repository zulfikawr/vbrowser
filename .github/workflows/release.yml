name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            libx11-dev \
            xvfb \
            xdotool \
            pulseaudio

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          VERSION=${{ github.ref_name }}
          LDFLAGS="-s -w -X 'github.com/zulfikawr/vbrowser/internal/cmd.Version=$VERSION'"
          go build -trimpath -ldflags="$LDFLAGS" -o vbrowser-linux-${{ matrix.goarch }} ./cmd/vbrowser

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vbrowser-linux-${{ matrix.goarch }}
          path: vbrowser-linux-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract release notes
        run: |
          awk "/^## \[${{ github.ref_name }}\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md > RELEASE_NOTES.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vbrowser-*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
