<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vbrowser - login</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #000;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }
      .login-container {
        background: rgba(20, 20, 20, 0.9);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 40px;
        border-radius: 20px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      .logo {
        font-size: 32px;
        font-weight: 800;
        margin-bottom: 8px;
        letter-spacing: -1px;
      }
      .subtitle {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.4);
        margin-bottom: 32px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      input[type="password"],
      input[type="text"] {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        padding: 14px 16px;
        padding-right: 48px;
        border-radius: 12px;
        font-size: 16px;
        outline: none;
        transition: all 0.2s;
        text-align: left;
        width: 100%;
      }
      .input-wrapper {
        position: relative;
        width: 100%;
      }
      .toggle-password {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        opacity: 0.4;
        transition: opacity 0.2s;
        display: flex;
        align-items: center;
      }
      .toggle-password:hover {
        opacity: 1;
      }
      input[type="password"]:focus,
      input[type="text"]:focus {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.3);
      }
      button {
        background: #fff;
        color: #000;
        border: none;
        padding: 14px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      button:hover {
        background: #e0e0e0;
        transform: translateY(-1px);
      }
      .error {
        color: #ff4b4b;
        font-size: 13px;
        margin-top: 16px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="logo">vbrowser</div>
      <div class="subtitle">Enter password to access stream</div>
      <form id="login-form" action="/login" method="POST">
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
            autofocus
          />
          <div class="toggle-password" id="toggle-pw">
            <svg
              id="eye-icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </div>
        </div>
        <button type="submit">Access Stream</button>
      </form>
      <div id="error-msg" class="error">
        Invalid password. Please try again.
      </div>
    </div>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has("error")) {
        document.getElementById("error-msg").style.display = "block";
      }

      const passwordInput = document.getElementById("password");
      const toggleBtn = document.getElementById("toggle-pw");
      const eyeIcon = document.getElementById("eye-icon");

      toggleBtn.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";

        if (isPassword) {
          eyeIcon.innerHTML = `
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          `;
        } else {
          eyeIcon.innerHTML = `
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          `;
        }
      });
    </script>
  </body>
</html>
