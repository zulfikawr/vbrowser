<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vbrowser - login</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #000;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }
      .login-container {
        background: rgba(20, 20, 20, 0.9);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 40px;
        border-radius: 20px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      .logo {
        font-size: 32px;
        font-weight: 800;
        margin-bottom: 8px;
        letter-spacing: -1px;
      }
      .subtitle {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.4);
        margin-bottom: 32px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      input[type="password"] {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        padding: 14px 16px;
        border-radius: 12px;
        font-size: 16px;
        outline: none;
        transition: all 0.2s;
        text-align: center;
      }
      input[type="password"]:focus {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.3);
      }
      button {
        background: #fff;
        color: #000;
        border: none;
        padding: 14px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      button:hover {
        background: #e0e0e0;
        transform: translateY(-1px);
      }
      .error {
        color: #ff4b4b;
        font-size: 13px;
        margin-top: 16px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="logo">vbrowser</div>
      <div class="subtitle">Enter password to access stream</div>
      <form id="login-form" action="/login" method="POST">
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
          autofocus
        />
        <button type="submit">Access Stream</button>
      </form>
      <div id="error-msg" class="error">
        Invalid password. Please try again.
      </div>
    </div>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has("error")) {
        document.getElementById("error-msg").style.display = "block";
      }
    </script>
  </body>
</html>
