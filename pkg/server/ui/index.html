<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vbrowser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #video-container.visible {
            opacity: 1;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: default;
            background: #000;
        }
        #status {
            display: none;
        }
        
        /* New Full-Page Disconnect State */
        #connection-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000; /* Solid black */
            z-index: 9999; /* Absolute top */
            opacity: 1;
            transition: opacity 0.3s ease;
            pointer-events: auto;
        }
        #connection-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .status-icon {
            font-size: 64px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.1));
        }
        .status-text {
            font-size: 18px;
            font-weight: 500;
            color: rgba(255,255,255,0.8);
            margin-bottom: 8px;
        }
        .status-subtext {
            font-size: 14px;
            color: rgba(255,255,255,0.4);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Dock UI */
        #dock-container {
            position: fixed;
            top: -70px;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 3000;
            transition: top 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #dock-container:hover, #dock-container.visible {
            top: 0;
        }
        #dock-trigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 15px;
            z-index: 2999;
        }
        #dock {
            background: rgba(25, 25, 25, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: none;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            padding: 8px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
            box-shadow: none;
            transition: box-shadow 0.3s ease;
        }
        #dock-container:hover #dock, #dock-container.visible #dock {
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .dock-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .dock-item label {
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 9px;
            opacity: 0.5;
            font-weight: 700;
        }
        .dock-item select {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 90px;
        }
        .dock-item select option {
            background: #1a1a1a;
            color: #fff;
        }
        .btn-apply {
            background: #fff;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-apply:hover { background: #e0e0e0; }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.5);
            z-index: 500;
            cursor: pointer;
            pointer-events: none;
            opacity: 0;
        }
        #overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .play-button {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #fff;
        }
        .play-button::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 25px solid #fff;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div id="dock-trigger"></div>
    <div id="dock-container">
        <div id="dock">
            <div class="dock-item">
                <label>Resolution</label>
                <select id="select-res">
                    <option value="auto">Auto (Match Screen)</option>
                    <option value="1920x1080">1080p</option>
                    <option value="1280x720">720p</option>
                </select>
            </div>
            <div class="dock-item">
                <label>Scaling</label>
                <select id="select-scaling">
                    <option value="contain">Fit (Letterbox)</option>
                    <option value="fill">Stretch (Fill)</option>
                </select>
            </div>
            <div class="dock-item">
                <label>FPS</label>
                <select id="select-fps">
                    <option value="60">60 FPS</option>
                    <option value="30">30 FPS</option>
                    <option value="15">15 FPS</option>
                </select>
            </div>
            <div class="dock-item">
                <label>Quality</label>
                <select id="select-bitrate">
                    <option value="8000">8 Mbps</option>
                    <option value="4000">4 Mbps</option>
                    <option value="2000">2 Mbps</option>
                </select>
            </div>
            <button class="btn-apply" id="btn-apply">APPLY CHANGES</button>
        </div>
    </div>

    <div id="connection-screen">
        <div id="connection-icon" class="status-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
        </div>
        <div id="connection-spinner" class="spinner"></div>
        <div id="connection-text" class="status-text">Connecting to vbrowser...</div>
        <div id="connection-subtext" class="status-subtext">Establishing secure WebRTC stream</div>
    </div>

    <div id="video-container">
        <div id="overlay">
            <div class="play-button"></div>
        </div>
        <div id="cursor"></div>
        <video id="video" playsinline></video>
    </div>
    <div id="status"></div>
    <script src="/client.js"></script>
</body>
</html>
