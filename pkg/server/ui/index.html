<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vbrowser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: none;
            background: #000; /* Ensure black background for letterboxing */
        }
        #cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 2000;
            display: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="white" stroke="black" stroke-width="1.5"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        #status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            font-size: 11px;
            z-index: 1000;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.1);
            transition: color 0.3s;
        }
        #status.connecting { color: #ffa500; }
        #status.connected { color: #7dff7d; }
        #status.disconnected { color: #ff6b6b; }
        
        /* Dock UI */
        #dock-container {
            position: fixed;
            top: -70px;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 3000;
            transition: top 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #dock-container:hover, #dock-container.visible {
            top: 0;
        }
        #dock-trigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 15px;
            z-index: 2999;
        }
        #dock {
            background: rgba(25, 25, 25, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: none;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            padding: 8px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .dock-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .dock-item label {
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 9px;
            opacity: 0.5;
            font-weight: 700;
        }
        .dock-item select {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 90px;
        }
        .dock-item select option {
            background: #1a1a1a;
            color: #fff;
        }
        .btn-apply {
            background: #fff;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-apply:hover { background: #e0e0e0; }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.5);
            z-index: 500;
            cursor: pointer;
            pointer-events: none;
            opacity: 0;
        }
        #overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .play-button {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #fff;
        }
        .play-button::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 25px solid #fff;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div id="dock-trigger"></div>
    <div id="dock-container">
        <div id="dock">
            <div class="dock-item">
                <label>Resolution</label>
                <select id="select-res">
                    <option value="auto">Auto (Match Screen)</option>
                    <option value="1920x1080">1080p</option>
                    <option value="1280x720">720p</option>
                </select>
            </div>
            <div class="dock-item">
                <label>Scaling</label>
                <select id="select-scaling">
                    <option value="contain">Fit (Letterbox)</option>
                    <option value="fill">Stretch (Fill)</option>
                </select>
            </div>
            <div class="dock-item">
                <label>FPS</label>
                <select id="select-fps">
                    <option value="60">60 FPS</option>
                    <option value="30" selected>30 FPS</option>
                    <option value="15">15 FPS</option>
                </select>
            </div>
            <div class="dock-item">
                <label>Quality</label>
                <select id="select-bitrate">
                    <option value="8000">8 Mbps</option>
                    <option value="4000" selected>4 Mbps</option>
                    <option value="2000">2 Mbps</option>
                </select>
            </div>
            <button class="btn-apply" id="btn-apply">APPLY CHANGES</button>
        </div>
    </div>

    <div id="status" class="connecting">● Connecting...</div>
    <div id="video-container">
        <div id="overlay">
            <div class="play-button"></div>
        </div>
        <div id="cursor"></div>
        <video id="video" autoplay playsinline></video>
    </div>
    <script src="/client.js"></script>
</body>
</html>
