<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vbrowser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }
        #video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #000;
        }
        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 4px;
            font-size: 14px;
            z-index: 1000;
        }
        .connecting { color: #ffa500; }
        .connected { color: #7dff7d; }
        .disconnected { color: #ff6b6b; }
    </style>
</head>
<body>
    <div id="status" class="connecting">● Connecting...</div>
    <video id="video" autoplay playsinline></video>
    <script src="/client.js"></script>
</body>
</html>
