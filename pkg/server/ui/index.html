<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vbrowser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #4a9eff;
        }
        p {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 0.5rem;
        }
        .status {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: #2d5016;
            color: #7dff7d;
            border-radius: 4px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>vbrowser</h1>
        <p>Virtual browser is running</p>
        <div class="status">● Ready</div>
    </div>
</body>
</html>
